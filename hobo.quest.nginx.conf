##
## Nginx config for Hobo.Quest
## Place at /etc/nginx/sites-available/hobo.quest and symlink to sites-enabled/
## Assumes: SSL terminated by certbot/Let's Encrypt, game server on 10.0.0.100:9000
##

upstream hoboquest_main  { server 10.0.0.100:9000; }
upstream hoboquest_city  { server 10.0.0.100:9001; }
upstream hoboquest_farm  { server 10.0.0.100:9002; }
upstream hoboquest_ship  { server 10.0.0.100:9003; }

## Redirect HTTP → HTTPS
server {
    listen 80;
    server_name hobo.quest www.hobo.quest;
    return 301 https://hobo.quest$request_uri;
}

## Main HTTPS server
server {
    listen 443 ssl http2;
    server_name hobo.quest www.hobo.quest;

    ssl_certificate     /etc/letsencrypt/live/hobo.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hobo.quest/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /opt/2dworld/public;
    index index.html;

    ## Serve static files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    ## Cache static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|css|mp3|ogg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    ## WebSocket proxy — main world (/)
    location /echo-protocol {
        proxy_pass http://hoboquest_main;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    ## WebSocket proxy — City instance (/city)
    location /city {
        proxy_pass http://hoboquest_city;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    ## WebSocket proxy — FarmIsland (/farmisland)
    location /farmisland {
        proxy_pass http://hoboquest_farm;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    ## WebSocket proxy — Ship (/ship)
    location /ship {
        proxy_pass http://hoboquest_ship;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    ## Spectate redirect  /#spectate  (pass-through — handled by client JS)
    ## No special nginx config needed; the hash is client-side only.

    ## Rate limiting for general requests
    limit_req_zone $binary_remote_addr zone=hoboquest:10m rate=30r/s;
    limit_req zone=hoboquest burst=60 nodelay;
}
