<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: sans-serif;
  }
  #box {
    position: absolute;
    width: 120px;
    height: 120px;
    background: lime;
    top: 180px;
    left: 0;
    animation: move 1s linear infinite alternate;
  }
  #clock {
    position: absolute;
    left: 20px;
    top: 20px;
    color: white;
    font-size: 42px;
    font-weight: 800;
  }
  @keyframes move {
    from { transform: translateX(0); }
    to   { transform: translateX(500px); }
  }
</style>
</head>
<body>
<div id="clock"></div>
<div id="box"></div>
<script>
let n = 0;
function tick() {
  document.getElementById('clock').textContent = 'FRAME ' + (++n) + ' ' + new Date().toLocaleTimeString();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
